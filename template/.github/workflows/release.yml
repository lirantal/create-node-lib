name: release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    permissions:
      contents: write       # to create release (changesets/action)
      issues: write         # to post issue comments (changesets/action)
      pull-requests: write  # to create pull request (changesets/action)
      id-token: write       # to create release (changesets/action)
      packages: write       # to publish to npm (changesets/action)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
<% if (npmClient === 'pnpm') { -%>
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
<% } -%>
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: '<%= npmClient %>'
<% if (npmClient === 'npm') { -%>
      - name: Set up pinned npm
        run: bash .github/scripts/setup-npm.sh
<% } -%>
      - name: install dependencies
        run: <%= npmClient === 'pnpm' ? 'pnpm install --frozen-lockfile' : 'npm ci' %>
      - name: build project
        run: <%= npmClient %> run build
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: <%= npmClient %> run release
          version-script: <%= npmClient %> run version
          commit-message: "chore: new release"
          pr-title: "chore: new release candidate"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NPM_TOKEN: ''
